<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Obras do Artista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/admin.css" />
  </head>
  <body>
    <header class="admin-header">
      <div>
        <p class="eyebrow">Administração</p>
        <h1>Cadastro de Obras</h1>
      </div>
      <a href="./index.html">Ver site</a>
    </header>

    <main class="admin-shell">
      <section class="admin-panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Dados</p>
            <h2 data-form-title>Adicionar obra</h2>
          </div>
          <button class="secondary-button" type="button" data-clear-form>Limpar</button>
        </div>

        <form class="artwork-form" data-artwork-form>
          <input type="hidden" name="id" />

          <label>
            <span>Título</span>
            <input name="title" type="text" required placeholder="Ex.: Paisagem de Dentro" />
          </label>

          <div class="form-grid">
            <label>
              <span>Categoria</span>
              <select name="category" required>
                <option value="pintura">Pintura</option>
                <option value="serie">Série</option>
                <option value="escultura">Escultura</option>
              </select>
            </label>

            <label>
              <span>Ano</span>
              <input name="year" type="text" required placeholder="2025" />
            </label>
          </div>

          <label>
            <span>Imagem</span>
            <input name="image" type="text" required placeholder="./assets/images/nome-da-obra.jpg" />
            <small>Informe um caminho existente ou envie uma imagem abaixo.</small>
          </label>

          <label>
            <span>Upload de imagem</span>
            <input name="imageFile" type="file" accept="image/*" />
            <small>Ao salvar, a imagem sera enviada para assets/images automaticamente.</small>
          </label>

          <div class="form-grid">
            <label>
              <span>Técnica</span>
              <input name="technique" type="text" required placeholder="Óleo sobre tela" />
            </label>

            <label>
              <span>Dimensões</span>
              <input name="size" type="text" required placeholder="80 x 100 cm" />
            </label>
          </div>

          <label>
            <span>Proporção da imagem</span>
            <select name="ratio">
              <option value="4 / 5">Vertical 4/5</option>
              <option value="3 / 4">Vertical 3/4</option>
              <option value="1 / 1">Quadrada</option>
              <option value="4 / 3">Horizontal 4/3</option>
              <option value="5 / 4">Horizontal 5/4</option>
              <option value="16 / 9">Horizontal 16/9</option>
            </select>
          </label>

          <label>
            <span>Descrição</span>
            <textarea name="description" required rows="5" placeholder="Descreva a obra, contexto, materiais e sensação visual."></textarea>
          </label>

          <button class="primary-button" type="submit" data-submit-button>Salvar obra</button>
        </form>
      </section>

      <section class="admin-panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Servidor</p>
            <h2>Status do cadastro</h2>
          </div>
        </div>

        <div class="actions-grid">
          <label class="file-button">
            Importar JSON para salvar
            <input type="file" accept="application/json,.json" data-import-json />
          </label>
          <button class="primary-button" type="button" data-export-json>Baixar backup JSON</button>
          <button class="secondary-button" type="button" data-copy-json>Copiar JSON</button>
        </div>

        <p class="helper-text">
          Este admin usa Node.js + Express. Ao salvar, o arquivo
          <strong>data/artworks.json</strong> e as imagens em
          <strong>assets/images</strong> sao atualizados no servidor.
        </p>

        <p class="admin-status" data-status>Pronto para cadastrar obras.</p>
        <textarea class="json-output" data-json-output readonly rows="12"></textarea>
      </section>

      <section class="admin-panel artwork-list-panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Obras cadastradas</p>
            <h2><span data-count>0</span> obras</h2>
          </div>
        </div>
        <div class="admin-artwork-list" data-artwork-list></div>
      </section>
    </main>

    <script src="./assets/admin.js"></script>
  </body>
</html>
